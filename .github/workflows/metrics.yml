name: Refresh metrics from Metricool

on:
  schedule:
    - cron: "15 */6 * * *"   # every 6 hours
  workflow_dispatch:          # lets you run it by hand from the Actions tab

permissions:
  contents: write
  actions: write

concurrency:
  group: metrics-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull numbers from Metricool
        env:
          METRICOOL_TOKEN: ${{ secrets.METRICOOL_TOKEN }}
        run: python scripts/fetch_metricool.py

      - name: Commit if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/metrics.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Refresh metrics $(date -u +%F)"
            git pull --rebase origin main
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Pushes made with the built-in token do not start other workflows,
      # so ask for the site deploy and the PDF rebuild explicitly.
      - name: Redeploy site and rebuild PDF
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run static.yml
          # rebuild the PDF once a day (the midnight run) and on any manual run,
          # so the repo does not collect a new PDF every 6 hours
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$(date -u +%H)" = "00" ]; then
            gh workflow run pdf.yml
          fi
