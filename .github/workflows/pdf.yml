name: Build one-sheet PDF

on:
  push:
    branches: ["main"]
    paths: ["data/metrics.json", "print/**", "scripts/build_pdf.py", "images/cover.jpg"]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: pdf-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # always build from the newest main, not the commit that triggered this run,
      # so a queued build can never overwrite a newer PDF with an older one
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install playwright && playwright install --with-deps chromium
      - run: python scripts/build_pdf.py
      - name: Commit the PDF
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "pdf-bot"
          git config user.email "pdf-bot@users.noreply.github.com"
          git add Ant_Davis_Media_Kit.pdf
          git diff --cached --quiet && exit 0
          git commit -m "Rebuild one-sheet PDF $(date -u +%F)"
          # the PDF is a build output, so if another build saved one first, keep this newer one
          git pull --rebase -X theirs origin main
          git push
          # the push above does not start the site deploy by itself, so the new PDF needs one
          gh workflow run static.yml
