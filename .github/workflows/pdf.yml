name: Build one-sheet PDF

on:
  push:
    branches: ["main"]
    paths: ["data/metrics.json", "print/**", "scripts/build_pdf.py", "images/cover.jpg"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pdf-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install playwright && playwright install --with-deps chromium
      - run: python scripts/build_pdf.py
      - name: Commit the PDF
        run: |
          git config user.name "pdf-bot"
          git config user.email "pdf-bot@users.noreply.github.com"
          git add Ant_Davis_Media_Kit.pdf
          git diff --cached --quiet && exit 0
          git commit -m "Rebuild one-sheet PDF $(date -u +%F)"
          git pull --rebase origin main
          git push
