name: Update Metricool stats

on:
  schedule:
    - cron: "15 */6 * * *"   # every 6 hours
  workflow_dispatch:          # lets you run it manually

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch analytics from Metricool
        env:
          METRICOOL_TOKEN: ${{ secrets.METRICOOL_TOKEN }}
          USER_ID: "5018589"
          BLOG_ID: "6516035"
        run: |
          mkdir -p data/raw
          FROM=$(date -u -d '60 days ago' +%Y-%m-%dT00:00:00)
          TO=$(date -u -d 'yesterday' +%Y-%m-%dT23:59:59)
          TZ_NAME="Europe/London"

          # fetch NAME PATH [key=value ...]  -> saves data/raw/NAME.json and prints the HTTP status
          fetch() {
            name="$1"; path="$2"; shift 2
            args=()
            for kv in "$@"; do args+=(--data-urlencode "$kv"); done
            code=$(curl -sS -G -H "X-Mc-Auth: $METRICOOL_TOKEN" \
              -o "data/raw/$name.json" -w '%{http_code}' \
              "https://app.metricool.com/api/v2/analytics/$path" \
              --data-urlencode "userId=$USER_ID" \
              --data-urlencode "blogId=$BLOG_ID" \
              "${args[@]}")
            echo "$name -> HTTP $code"
          }

          # Instagram: posts, reels, followers over time, audience
          fetch ig-posts   posts/instagram  "from=$FROM" "to=$TO"
          fetch ig-reels   reels/instagram  "from=$FROM" "to=$TO"
          fetch ig-followers timelines "metric=followers" "network=instagram" "subject=account" "timezone=$TZ_NAME" "from=$FROM" "to=$TO"
          fetch ig-age     distribution "metric=age"     "network=instagram" "subject=account" "from=$FROM" "to=$TO"
          fetch ig-gender  distribution "metric=gender"  "network=instagram" "subject=account" "from=$FROM" "to=$TO"
          fetch ig-country distribution "metric=country" "network=instagram" "subject=account" "from=$FROM" "to=$TO"

          # TikTok: posts, followers, views, shares over time
          fetch tt-posts     posts/tiktok "from=$FROM" "to=$TO"
          fetch tt-followers timelines "metric=followers_count" "network=tiktok" "subject=account" "timezone=$TZ_NAME" "from=$FROM" "to=$TO"
          fetch tt-views     timelines "metric=views"  "network=tiktok" "timezone=$TZ_NAME" "from=$FROM" "to=$TO"
          fetch tt-shares    timelines "metric=shares" "network=tiktok" "timezone=$TZ_NAME" "from=$FROM" "to=$TO"
          fetch tt-videos    timelines "metric=videos" "network=tiktok" "timezone=$TZ_NAME" "from=$FROM" "to=$TO"

          # Check run: the exact window the kit currently shows (10 Jul to 8 Sep 2026),
          # so the totals can be compared with the numbers on the page
          fetch check-ig-posts posts/instagram "from=2026-07-10T00:00:00" "to=2026-09-08T23:59:59"
          fetch check-ig-reels reels/instagram "from=2026-07-10T00:00:00" "to=2026-09-08T23:59:59"
          fetch check-tt-posts posts/tiktok    "from=2026-07-10T00:00:00" "to=2026-09-08T23:59:59"

      - name: Commit if changed
        run: |
          git config user.name "stats-bot"
          git config user.email "stats-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Update stats"
          git push
